<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="按章节与知识点浏览题库题目" />
    <title>飞象 AI 题库 · 单题组卷</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./school.css" />
    <link rel="stylesheet" href="./theme-workspace-v50.css?v=20260813workspace2" />
    <link rel="stylesheet" href="./home-revision-v51.css?v=20260818home12" />
  </head>
  <body class="school-library-page">
    <main class="page school-page">
      <section class="discovery site-header school-header" aria-label="题库导航">
        <a class="brand-mark" href="./index.html" aria-label="飞象AI题库首页"><span class="brand-mark-glyph" aria-hidden="true"><i class="ri-sparkling-2-fill"></i></span><span class="brand-mark-text">飞象AI题库</span></a>
        <nav class="filter-chips category-tabs" aria-label="题库分类">
          <a href="./index.html"><span>首页</span></a>
          <a href="./index.html?filter=chapter"><span>同步练习</span></a>
          <a href="./index.html?filter=workbook"><span>练习册</span></a>
          <a href="./index.html?filter=paper"><span>试卷</span></a>
          <a href="./index.html?filter=special"><span>专题</span></a>
          <span class="category-nav-divider" aria-hidden="true"></span>
          <a class="school-library-entry category-nav-link active" href="./school.html" aria-current="page"><span>单题组卷</span></a>
        </nav>
        <div class="context-identity" aria-label="当前教师信息"><i class="ri-map-pin-2-line"></i><span>深圳市龙岗区</span><i class="context-divider"></i><span>七年级数学</span></div>
      </section>

      <section class="question-bank-shell" aria-label="题库工作区">
        <aside class="selected-question-panel" id="selectedQuestionPanel" aria-label="已选题目">
          <button class="selected-panel-expand" id="selectedPanelExpand" type="button" aria-label="展开已选题目">
            <i class="ri-checkbox-multiple-line"></i>
            <span class="selected-panel-expand-count" id="selectedPanelExpandCount">2</span>
            <span>已选题目</span>
          </button>
          <div class="selected-panel-main">
            <header class="selected-panel-head"><div><strong>已选题目</strong><span>已选 <b id="selectedPanelCount">2</b> 题</span></div><div><button type="button" id="selectedPanelEnlarge">放大查看</button><button type="button" id="selectedPanelClear">清空</button><button class="selected-panel-collapse" type="button" id="selectedPanelCollapse"><i class="ri-arrow-left-double-line"></i> 收起</button></div></header>
            <div class="selected-panel-body"><h3><span id="selectedPanelTitleCount">2</span>道选择</h3><div id="selectedPanelList" class="selected-panel-list"></div></div>
            <footer class="selected-panel-foot"><button type="button" id="selectedPanelCreate"><i class="ri-add-box-line"></i>创建题单(<span>2</span>)</button><button type="button" id="selectedPanelAi"><i class="ri-sparkling-2-line"></i>AI 补充(<span>2</span>)</button></footer>
          </div>
        </aside>
        <aside class="bank-sidebar">
          <div class="bank-side-tabs" role="tablist" aria-label="题库导航方式">
            <button class="active" type="button" role="tab" aria-selected="true" data-side-view="chapters">教材章节</button>
            <button type="button" role="tab" aria-selected="false" data-side-view="knowledge">知识点</button>
          </div>
          <label class="bank-side-search" id="bankSideSearchWrap">
            <i class="ri-search-line"></i>
            <input id="bankSideSearch" type="search" placeholder="请输入搜索关键词" aria-label="搜索章节或知识点" />
          </label>
          <button class="scope-picker" type="button" id="scopePicker" data-chapters-only><span>人教版/七年级上册 (2024)</span><i class="ri-arrow-down-s-line"></i></button>
          <div class="bank-nav-heading"><span>全部资源</span><strong id="bankNavCount">48 题</strong></div>
          <nav id="bankNav" class="bank-nav" aria-label="教材章节导航"></nav>
        </aside>

        <section class="bank-content">
          <header class="bank-content-toolbar">
            <div class="filter-pills" aria-label="题目筛选">
              <label class="filter-pill"><span>题型</span><select id="typeFilter" aria-label="按题型筛选"><option value="all">全部</option><option>单项选择题</option><option>填空题</option><option>解答题</option></select><i class="ri-arrow-down-s-line"></i></label>
              <label class="filter-pill"><span>难度</span><select id="difficultyFilter" aria-label="按难度筛选"><option value="all">不限</option><option>简单</option><option>较易</option><option>中等</option><option>较难</option></select><i class="ri-arrow-down-s-line"></i></label>
              <label class="filter-pill"><span>试卷类型</span><select id="paperTypeFilter" aria-label="按试卷类型筛选"><option value="all">全部</option><option>期中</option><option>期末</option><option>月考</option></select><i class="ri-arrow-down-s-line"></i></label>
              <label class="filter-pill"><span>练习册系列</span><select id="seriesFilter" aria-label="按练习册系列筛选"><option value="all">全部</option><option>全品作业本</option><option>多维导学案</option></select><i class="ri-arrow-down-s-line"></i></label>
              <button class="filter-more" type="button" id="filterMore"><i class="ri-equalizer-3-line"></i> 其他</button>
            </div>
          </header>

          <div class="bank-search-row">
            <label class="question-search"><i class="ri-search-line"></i><input id="questionSearch" type="search" placeholder="请输入关键词" aria-label="搜索题目或知识点" /></label>
            <button class="image-search" type="button" id="imageSearch"><i class="ri-camera-line"></i> 图片搜题</button>
          </div>

          <div class="question-heading">
            <div class="question-view-tabs" role="tablist" aria-label="题目排序">
              <button class="active" type="button" role="tab" aria-selected="true" data-sort="recommended">推荐</button>
              <button type="button" role="tab" aria-selected="false" data-sort="latest">最新</button>
            </div>
            <span id="questionCount">共 12 道题</span>
          </div>

          <div id="questionList" class="question-list"></div>
          <div id="questionEmpty" class="question-empty" hidden>
            <i class="ri-search-eye-line"></i>
            <strong>暂时没有符合条件的题目</strong>
            <span>可以切换章节，或减少筛选条件。</span>
          </div>
        </section>

      </section>
    </main>

    <div id="schoolToast" class="school-toast" role="status" aria-live="polite"></div>
    <script defer src="./school.js"></script>
  </body>
</html>
