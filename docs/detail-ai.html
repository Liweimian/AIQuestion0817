<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="飞象 AI 题库 · AI 试卷工作台" />
    <title>AI 试卷工作台 · 飞象 AI 题库</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" />
    <link rel="stylesheet" href="./detail.css" />
    <link rel="stylesheet" href="./detail-ai.css?v=20260811special" />
    <style id="ai-panel-legacy-toggle-hide">
      #aiPanelExpand.legacy-hidden,
      #openAiPanel,
      #toggleAiPanel {
        display: none !important;
      }
    </style>
  </head>
  <body class="ai-detail-page">
    <header class="ai-detail-topbar">
      <a class="back-home" href="./index.html"><i class="ri-arrow-left-line"></i><span>题库首页</span></a>
      <button id="topbarExpandSelected" class="topbar-expand-selected" type="button" hidden>
        <i class="ri-checkbox-multiple-line"></i><span>展开已选题目</span>
      </button>
      <nav class="breadcrumb" aria-label="当前位置">
        <span id="breadcrumbContext">试卷</span>
        <i class="ri-arrow-right-s-line"></i>
        <strong id="breadcrumbLeaf">试卷详情</strong>
      </nav>
      <button id="mobileDirectory" class="mobile-directory" type="button" hidden><i class="ri-list-unordered"></i>目录</button>
    </header>

    <div class="ai-workspace" id="aiWorkspace">
      <aside class="ai-selected-panel" id="aiSelectedPanel" aria-label="已选题目">
        <button class="ai-selected-expand" id="aiSelectedExpand" type="button" aria-label="展开已选题目">
          <i class="ri-checkbox-multiple-line"></i>
          <span class="ai-selected-expand-count" id="aiSelectedExpandCount" hidden>0</span>
          <span>已选题目</span>
        </button>
        <div class="ai-selected-body">
          <header class="ai-section-head" id="selectedSectionHead">
            <div class="ai-section-head-main">
              <strong>已选题目</strong>
              <span class="ai-selected-hint" id="aiSelectedHint">还没有选题</span>
            </div>
            <div class="ai-section-head-actions">
              <button type="button" id="clearSelectedQuestions">清空</button>
              <button type="button" class="panel-action-btn panel-action-btn-compact" id="collapseSelectedPanel" aria-label="收起已选题目" title="收起已选题目">
                <i class="ri-arrow-left-double-line"></i><span>收起</span>
              </button>
            </div>
          </header>
          <div id="aiSelectedContext" class="ai-selected-context">
            <p class="ai-selected-summary" id="aiSelectedSummary" hidden></p>
            <div id="aiSelectedPreview" class="ai-selected-preview"></div>
            <p class="ai-selected-empty" id="aiSelectedEmpty">把题目或题型模块拖到这里；也可点「添加」。Shift / ⌘ 可多选后一起拖入</p>
          </div>
          <footer class="ai-selected-footer">
            <button type="button" class="ai-selected-create" id="createQuestionList" disabled>
              <i class="ri-file-add-line"></i><span id="createQuestionListLabel">请先添加题目</span>
            </button>
            <button type="button" class="ai-selected-ai-entry" id="openAiCreate">
              <i class="ri-sparkling-2-line"></i><span id="openAiCreateLabel">用 AI 生成题单</span>
            </button>
          </footer>
        </div>
      </aside>

      <div class="ai-main-column" id="aiMainColumn">
        <div class="ai-content-shell" id="aiContentShell">
          <aside id="directoryPanel" class="ai-directory-panel" aria-label="练习册目录" hidden>
            <button id="directoryToggle" class="directory-toggle" type="button" aria-expanded="false" aria-controls="directoryTree">
              <span class="directory-toggle-label"><i class="ri-list-unordered"></i><span>目录</span></span>
              <span class="panel-action-btn panel-action-btn-compact directory-toggle-fold"><i class="ri-arrow-left-double-line"></i><span>收起</span></span>
            </button>
            <div class="directory-head">
              <small id="directoryKicker">练习册目录</small>
              <h2 id="directoryTitle">多维导学案 · 七年级上册</h2>
              <p id="directorySummary">共 6 章 · 36 课时</p>
            </div>
            <nav id="directoryTree" class="directory-tree"></nav>
            <footer class="directory-footer">
              <i class="ri-sparkling-2-line"></i>
              <span>目录由课时自动归类</span>
            </footer>
          </aside>

          <section class="doc-workspace" aria-label="试卷预览">
            <nav class="doc-tabs doc-tabs-top" id="docTabs" aria-label="已打开的试卷"></nav>
            <div class="home-view" id="homeView" hidden>
              <iframe id="homeFrame" class="home-view-frame" title="题库首页" src="about:blank"></iframe>
            </div>
            <div class="doc-preview-scroll" id="docPreviewScroll">
              <div class="paper-detail-layout">
                <div class="paper-main-column">
                  <section class="paper-meta-bar">
                    <div class="paper-meta-main">
                      <h2 id="topicTitle">2026 深圳南山区初一上期末数学真题</h2>
                      <p class="paper-meta-facts" id="paperMetaFacts"></p>
                    </div>
                    <div class="paper-meta-inline-actions">
                      <button type="button" class="paper-action-ghost" id="toggleShowAnswer"><i class="ri-eye-line"></i><span>显示答案</span></button>
                      <button type="button" class="paper-action-ghost" id="favoritePaper"><i class="ri-star-line"></i><span id="favoritePaperLabel">收藏</span></button>
                      <button type="button" class="paper-action-ghost" data-action="download"><i class="ri-download-2-line"></i><span>下载</span></button>
                      <button type="button" class="paper-action-ghost" data-action="edit"><i class="ri-layout-2-line"></i><span>排版</span></button>
                      <button type="button" class="paper-action-primary" id="batchAddAllQuestions"><i class="ri-add-box-line"></i><span>全部添加</span></button>
                    </div>
                  </section>

                  <div id="questionCardBoard" class="question-card-board"></div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>

    </div>

    <div id="directoryMask" class="directory-mask" hidden></div>
    <div id="panelMask" class="panel-mask" hidden></div>

    <div id="aiCreateModal" class="ai-create-modal" hidden>
      <div class="ai-create-mask" data-ai-create-close></div>
      <div class="ai-create-panel" role="dialog" aria-modal="true" aria-labelledby="aiCreateTitle">
        <header class="ai-create-head">
          <strong id="aiCreateTitle"><i class="ri-sparkling-2-line"></i>AI 创建题单</strong>
          <button type="button" class="ai-create-close" data-ai-create-close aria-label="关闭"><i class="ri-close-line"></i></button>
        </header>
        <div class="ai-create-body">
          <div class="ai-create-context" id="aiCreateContext" hidden>
            <label class="ai-create-checkbox">
              <input type="checkbox" id="aiCreateUseSelected" checked />
              <span>以已选 <b id="aiCreateSelectedCount">0</b> 题为基础</span>
            </label>
            <p class="ai-create-context-summary" id="aiCreateContextSummary"></p>
          </div>
          <label class="ai-create-field">
            <span>想要什么样的题单？</span>
            <textarea id="aiCreatePrompt" rows="3" placeholder="例如：再补 5 道同类型但难一点的题，总共控制在 12 题"></textarea>
          </label>
          <div class="ai-create-chips" id="aiCreateChips"></div>
        </div>
        <footer class="ai-create-foot">
          <button type="button" class="ai-create-cancel" data-ai-create-close>取消</button>
          <button type="button" class="ai-create-submit" id="aiCreateSubmit"><i class="ri-sparkling-2-line"></i><span>生成题单</span></button>
        </footer>
      </div>
    </div>

    <div id="toast" class="toast" role="status"></div>
    <script src="./detail-ai.js?v=20260811special"></script>
  </body>
</html>
